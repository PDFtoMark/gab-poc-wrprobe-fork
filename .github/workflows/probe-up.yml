name: Probe Upstream
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - name: forged
        run: |
          echo "this is the attacker version of the upstream workflow" > marker.txt
          echo "artifact-body" > event.json
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-marker
          path: event.json
